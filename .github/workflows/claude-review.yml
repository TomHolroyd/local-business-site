# Review agent: comments on every PR. A human still approves and merges.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the rules in CLAUDE.md. Check specifically:
            - Business facts (services, prices, hours, phone, address) are only changed where the PR/issue asks for it.
              Flag any new claim about the business that isn't backed by the linked issue.
            - No JavaScript dependencies, external scripts, fonts, trackers or embeds were added.
            - Copy is plain UK English, short, and free of spelling mistakes.
            - Templates still render on mobile (no fixed widths that would overflow 360px).
            Leave one summary comment with `gh pr comment`; use inline comments only for specific problems.
            If everything is fine, say so in one line.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment,Read,Glob,Grep"
